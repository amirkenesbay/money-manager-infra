apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-alerts
        type: telegram
        settings:
          bottoken: "__TELEGRAM_BOT_TOKEN__"
          chatid: "__TELEGRAM_ALERT_CHAT_ID__"
          disable_notification: false

policies:
  - orgId: 1
    receiver: telegram
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: money-manager
    folder: Money Manager
    interval: 1m
    rules:
      - uid: app-down
        title: Приложение недоступно
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: "Prometheus не может достучаться до приложения больше 2 минут"
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "up{job=\"app\"}"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
      - uid: http-5xx
        title: Ошибки 5xx в API
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "API отвечает ошибками 5xx чаще раза в 10 секунд"
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
      - uid: gemini-quota
        title: Gemini упёрся в квоту
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Gemini отвечает 429: квота исчерпана, ИИ у пользователей не работает"
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "sum(increase(moneymanager_gemini_requests_seconds_count{outcome=\"quota\"}[15m]))"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
      - uid: disk-full
        title: Диск почти заполнен
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Занято больше 85% диска сервера"
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.85]
      - uid: memory-high
        title: Мало памяти
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Свободной памяти на сервере меньше 10%"
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes"
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
