services:
  app:
    image: ghcr.io/amirkenesbay/money-manager-ai:latest
    container_name: money-manager-ai
    restart: always
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g -XX:+UseSerialGC"
      MONGO_HOST: mongo
      SPRING_MONGODB_PORT: 27017
      CHAT_MACHINIST_VISUALIZE: "false"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: ghcr.io/amirkenesbay/money-manager-webapp:latest
    container_name: money-manager-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app

  mongo:
    image: mongo:8.0
    container_name: money-manager-mongo
    restart: always
    command: ["--wiredTigerCacheSizeGB", "0.75"]
    ports:
      - "127.0.0.1:27017:27017"
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./volumes/mongo/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
      - ./volumes/mongo/grafana-reader.js:/docker-entrypoint-initdb.d/grafana-reader.js:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: money-manager-prometheus
    restart: always
    mem_limit: 400m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.1
    container_name: money-manager-grafana
    restart: always
    mem_limit: 400m
    entrypoint: ["/bin/sh", "/render-provisioning.sh"]
    environment:
      GF_PATHS_PROVISIONING: /tmp/grafana-provisioning
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: https://github.com/haohanyang/mongodb-datasource/releases/download/v0.5.0/haohanyang-mongodb-datasource-0.5.0.zip;haohanyang-mongodb-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: haohanyang-mongodb-datasource
      MONGO_GRAFANA_PASSWORD: ${MONGO_GRAFANA_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID: ${ALERT_CHAT_ID}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./grafana/render-provisioning.sh:/render-provisioning.sh:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - mongo

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: money-manager-node-exporter
    restart: always
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

volumes:
  mongo_data:
  prometheus_data:
  grafana_data: