name: Deploy to VPS

on:
  repository_dispatch:
    types: [deploy]
  push:
    branches: [master]
    paths:
      - 'docker-compose.yml'
      - 'volumes/**'
      - 'nginx/**'
      - 'prometheus/**'
      - 'grafana/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Pull image and restart app on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash <<'EOF'
          set -euo pipefail
          cd /opt/money-manager
          git pull --ff-only
          docker compose pull app web
          docker compose up -d
          docker compose restart prometheus grafana
          docker compose ps

          # notify the alerts chat that the new image is live
          set -a; . ./.env; set +a
          IMAGE_SHA="$(docker inspect --format '{{.Image}}' money-manager-ai | cut -c8-19)"
          BUILT_AT="$(docker inspect --format '{{.Created}}' "$(docker inspect --format '{{.Image}}' money-manager-ai)" | cut -c1-16)"
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${ALERT_CHAT_ID}" \
            -d text="🚀 money-manager-ai deployed — image ${IMAGE_SHA}, built ${BUILT_AT}Z" >/dev/null
          EOF